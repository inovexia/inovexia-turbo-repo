<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 560" width="880" height="560" role="img" aria-label="Learning Management System dashboard: course progress, learner activity and upcoming assessments">
<defs>
  <linearGradient id="lms-bg" x1="0" y1="0" x2="880" y2="560" gradientUnits="userSpaceOnUse">
    <stop offset="0" stop-color="#4c3fdc"/><stop offset=".55" stop-color="#6d5efc"/><stop offset="1" stop-color="#22d3ee"/>
  </linearGradient>
  <linearGradient id="lms-bar" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#ffffff" stop-opacity=".95"/><stop offset="1" stop-color="#ffffff" stop-opacity=".55"/>
  </linearGradient>
</defs>

<rect width="880" height="560" rx="18" fill="url(#lms-bg)"/>

<!-- app chrome -->
<rect x="24" y="24" width="832" height="512" rx="14" fill="rgba(8,10,23,.62)"/>
